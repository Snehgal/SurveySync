<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seat Map Login · SurveySync</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/live.css"></head>
<body><main class="login-wrap"><section class="login-card">
<img src="/ece-logo.png" alt="IIIT Delhi ECE" width="100"><p class="eyebrow">SURVEYSYNC · LAB ACCESS</p>
<h1>Your lab, in view.</h1><p class="login-description">Sign in to manage live responses and help requests.</p>
<form id="login-form"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<p id="login-error" role="alert"></p><button class="primary-button" type="submit">Sign in to seat map →</button></form>
<p class="login-note">Use your seat-map account. Schedule administrator access is separate.</p>
</section></main><footer><span>SurveySync</span><span>Department of Electronics &amp; Communications Engineering</span></footer>
<script>
document.getElementById('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = event.target.querySelector('button'); button.disabled = true;
    try {
        const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message);
        location.replace('/');
    } catch (error) { document.getElementById('login-error').textContent = error.message; }
    finally { button.disabled = false; }
});
</script></body></html>
